name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest

    # The integration suite talks to a real Postgres rather than an in-memory provider, so
    # the same SQL (ILike, OFFSET/LIMIT, FK restrictions) runs in CI as locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: assignment_submission_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_only
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only values. The real key lives in the deployment environment, never in the repo.
      ConnectionStrings__Default: Host=localhost;Port=5434;Database=assignment_submission_dev;Username=postgres;Password=postgres_dev_only
      Jwt__Key: ci-only-jwt-signing-key-not-for-production-use-32chars
      Jwt__Issuer: AssignmentSubmissionSystem
      Jwt__Audience: AssignmentSubmissionSystem.Client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/AssignmentSubmissionSystem.sln

      - name: Build
        run: dotnet build backend/AssignmentSubmissionSystem.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/AssignmentSubmissionSystem.sln --no-build --configuration Release

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
