# Pinned so the project name is not derived from the directory name ("backend"), which
# collides with unrelated compose stacks that also live in a directory called "backend"
# and would share this project's network, volumes and teardown scope.
# No `container_name` on the services: a fixed container name is global to the daemon, so it
# conflicts with any other stack (or an older run of this one) that claims the same name.
# Compose-generated names (assignment-submission-postgres-1) are scoped to the project instead.
name: assignment-submission

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assignment_submission_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
    # Bound to loopback: the api service reaches postgres over the compose network, so the
    # only consumer of the published port is a psql/GUI client on this machine. Publishing
    # on 0.0.0.0 would expose a database carrying the default dev password to the LAN.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Development by default so a fresh `docker compose up` gives the evaluator seeded
      # demo accounts and Swagger UI. Both are Development-gated in Program.cs: seeding
      # plants passwords that are published in the README, and neither belongs in a real
      # deployment. Set ASPNETCORE_ENVIRONMENT=Production for anything beyond local use.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-assignment_submission_dev};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres_dev_only}
      Jwt__Key: ${Jwt__Key:?Jwt__Key must be set}
      Jwt__Issuer: ${Jwt__Issuer:-AssignmentSubmissionSystem}
      Jwt__Audience: ${Jwt__Audience:-AssignmentSubmissionSystem.Client}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes:-60}
      # Browser origin of the Next.js app. Override when the frontend runs on a
      # different host or port than the appsettings.json defaults.
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${FRONTEND_ORIGIN_ALT:-http://127.0.0.1:3000}
      # Fixed-window brute-force guard on POST /auth/login, bound to LoginRateLimitOptions
      # ("RateLimiting:Login"). Forwarded explicitly: without these lines the variables in
      # .env are accepted silently and never reach the container, so tuning the throttle
      # would appear to work while the code defaults (10 requests / 60s) stayed in force.
      RateLimiting__Login__PermitLimit: ${RateLimiting__Login__PermitLimit:-10}
      RateLimiting__Login__WindowSeconds: ${RateLimiting__Login__WindowSeconds:-60}
    ports:
      - "${API_PORT:-5000}:8080"
    # /health is anonymous and checks the database connection, so "healthy" here means the
    # API can actually serve requests. busybox wget ships in the alpine runtime image.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      # The Next.js app lives outside this file's directory; compose resolves the context
      # relative to the compose file, so ../frontend is the app root.
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time. This is the URL the browser uses, so
        # it must be the published host port of the api service, not http://api:8080.
        #
        # Because this is inlined at build time rather than read at startup, changing
        # NEXT_PUBLIC_API_URL or API_PORT in .env does NOT take effect on a plain
        # `docker compose up` — compose reuses the cached image and the browser keeps
        # calling the old URL, with no error at build or boot. Rebuild after changing
        # either one:  docker compose up -d --build frontend
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    # Without this the container counts as up the moment the process spawns, so a server.js
    # that dies on boot still reports as running. Requesting "/" exercises the Next.js
    # server itself; the interval is loose because this renders a real page.
    # 127.0.0.1, not localhost: the server binds 0.0.0.0 (IPv4 only) while /etc/hosts maps
    # localhost to ::1 as well, and busybox wget tries the v6 address first and gets
    # ECONNREFUSED — a permanently unhealthy container in front of a working server.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
